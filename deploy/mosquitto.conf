# Weather sensor broker config (production).
#
# Install as a drop-in: copy to /etc/mosquitto/conf.d/weather.conf on the Pi.
# The base /etc/mosquitto/mosquitto.conf already enables persistence and
# includes this directory, so we only add the listener + auth here.
#
# Security model for v1: password-authenticated, plain TCP on the trusted LAN.
# TLS is intentionally out of scope (see the project plan). Keep the Pi on a
# trusted network and/or firewall port 1883 to the LAN.

# Listen on port 1883 (all interfaces). The password file below is the access
# control — anonymous clients are rejected.
listener 1883

# Require a username/password. Create the file with:
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd weather
allow_anonymous false
password_file /etc/mosquitto/passwd
