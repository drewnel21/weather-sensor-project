# Mosquitto config for DEV ONLY.
#
# - Opens port 1883 to the LAN so the Pico W can connect.
# - Allows anonymous connections (no username/password) so we don't have to
#   provision creds on each Pico during prototyping.
# - Enables verbose connection logging so you can see Pico connect/publish
#   activity in the terminal in real time.
#
# DO NOT USE THIS IN PRODUCTION. Milestone 7's deploy/mosquitto.conf will
# add a password file, restrict bind to the LAN interface only, and (later)
# add TLS.
#
# Run it from the project root in PowerShell:
#   & "C:\Program Files\mosquitto\mosquitto.exe" -c deploy\mosquitto.dev.conf -v
# Ctrl+C to stop. Keep the window open while the Pico is publishing — every
# connect/disconnect/publish is logged there.

listener 1883 0.0.0.0
allow_anonymous true

# Verbose logging to stdout. Drop to "notice" once things work if it's noisy.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
